# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.7.0/docs/schemas/icp-yaml-schema.json
#
# Explicit build steps instead of the @dfinity/rust recipe so Cargo features can
# select the embedded runtimes. Default: all-in-one router (js + python + rhai).
# For a dedicated worker, copy the entry, rename it, and build with e.g.
#   cargo build ... --no-default-features --features rhai --target-dir target/rhai
# and copy target/rhai/wasm32-unknown-unknown/release/icp_code_mode.wasm.
canisters:
  - name: icp_code_mode
    build:
      steps:
        - type: script
          commands:
            - "command -v ic-wasm >/dev/null 2>&1 || { echo >&2 'ic-wasm not found, see https://github.com/dfinity/ic-wasm'; exit 1; }"
            # --target-dir pins where the wasm lands, whatever CARGO_TARGET_DIR says.
            - cargo build --package icp_code_mode --target wasm32-unknown-unknown --release --locked --target-dir target
            - cp target/wasm32-unknown-unknown/release/icp_code_mode.wasm "$ICP_WASM_OUTPUT_PATH"
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata candid:service -f icp_code_mode.did -v public
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" shrink
    # `opt InitArgs`, applied at install only (an upgrade ignores it, so it cannot bring
    # back revoked tokens); tokens and allowlist are managed after deploy (see README).
    init_args: "(null)"
    # The 1 GiB heap ceiling (src/lib.rs, counting_alloc) assumes this limit stays well
    # above it; the threshold triggers the on_low_wasm_memory hook, which frees garbage.
    settings:
      wasm_memory_limit: 3221225472 # 3 GiB
      wasm_memory_threshold: 536870912 # 512 MiB

  # Demo target: a small store with 10 methods and seeded data (see demo_store/).
  # After deploy, run scripts/demo-setup.sh to allowlist it in icp_code_mode.
  - name: demo_store
    build:
      steps:
        - type: script
          commands:
            - cargo build --package demo_store --target wasm32-unknown-unknown --release --locked --target-dir target
            - cp target/wasm32-unknown-unknown/release/demo_store.wasm "$ICP_WASM_OUTPUT_PATH"
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" metadata candid:service -f demo_store/demo_store.did -v public
            - ic-wasm "$ICP_WASM_OUTPUT_PATH" -o "$ICP_WASM_OUTPUT_PATH" shrink

# Local network on 8010 so it can run beside other projects' networks (default 8000).
networks:
  - name: local
    mode: managed
    gateway:
      port: 8010
