[package]
edition = "2021"
rust-version = "1.78.0"
name = "candid"
version = "0.10.40"
authors = ["DFINITY Team"]
build = false
include = [
    "src",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Candid is an interface description language (IDL) for interacting with canisters running on the Internet Computer."
homepage = "https://internetcomputer.org/docs/current/developer-docs/build/candid/candid-concepts"
documentation = "https://docs.rs/candid"
readme = "README.md"
keywords = [
    "internet-computer",
    "idl",
    "candid",
    "dfinity",
]
categories = [
    "encoding",
    "wasm",
]
license = "Apache-2.0"
repository = "https://github.com/dfinity/candid"

[package.metadata.docs.rs]
features = ["all"]
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
all = [
    "default",
    "value",
    "ic_principal/arbitrary",
]
bignum = [
    "dep:num-bigint",
    "dep:num-traits",
]
default = [
    "serde_bytes",
    "printer",
    "bignum",
]
printer = ["dep:pretty"]
value = [
    "bignum",
    "printer",
]

[lib]
name = "candid"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.binrw]
version = "0.15"
features = ["std"]
default-features = false

[dependencies.byteorder]
version = "1.5.0"

[dependencies.candid_derive]
version = "=0.10.40"

[dependencies.hex]
version = "0.4.3"

[dependencies.ic_principal]
version = "0.1.0"

[dependencies.leb128]
version = "0.2.5"

[dependencies.num-bigint]
version = "0.4"
features = ["serde"]
optional = true

[dependencies.num-traits]
version = "0.2"
optional = true

[dependencies.paste]
version = "1.0"

[dependencies.pretty]
version = "0.12"
optional = true

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.serde_bytes]
version = "0.11"
optional = true

[dependencies.thiserror]
version = "1.0"

[dev-dependencies.bincode]
version = "1.3.3"

[dev-dependencies.rand]
version = "0.8"

[dev-dependencies.serde_cbor]
version = "0.11.2"

[dev-dependencies.serde_json]
version = "1.0.74"

[target.'cfg(not(target_family = "wasm"))'.dependencies.stacker]
version = "0.1"

[lints.clippy.all]
level = "deny"
priority = 0

[lints.clippy.uninlined_format_args]
level = "allow"
priority = 1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(wasm_bindgen_unstable_test_coverage)"]
