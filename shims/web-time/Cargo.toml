# Drop-in replacement for web-time 1.1 used via [patch.crates-io].
# Upstream web-time reads `performance.now()` through wasm-bindgen, which ICP
# replicas do not provide. monty-types reads Instant::now() around every
# execution window, so here `Instant` counts IC instructions instead:
# deterministic across replicas, and 1 "nanosecond" == 1 instruction, which turns
# monty's duration limits into instruction budgets.
[package]
name = "web-time"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
ic0 = "1.2.0"
