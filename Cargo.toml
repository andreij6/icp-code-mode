[package]
name = "icp_code_mode"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["js", "python", "rhai"]
js = ["dep:boa_engine", "dep:boa_gc", "dep:futures"]
python = ["dep:monty", "dep:monty-types", "dep:futures"]
rhai = ["dep:rhai"]

[dependencies]
ic-cdk = "0.20.3"
candid = "0.10.40"
candid_parser = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
ic-stable-structures = "0.7.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.3"
futures = { version = "0.3", default-features = false, features = ["alloc"], optional = true }
boa_engine = { version = "0.22.0", default-features = false, optional = true }
boa_gc = { version = "0.22.0", optional = true }
monty = { version = "=1.6.0", optional = true }
monty-types = { version = "=1.6.0", optional = true }
rhai = { version = "1.27.0", features = ["sync", "no_time", "serde"], optional = true }

# Both patches exist only to keep wasm-bindgen out of the canister (ICP rejects any
# import outside `ic0`); see the header comment in each.
[patch.crates-io]
web-time = { path = "shims/web-time" }
chrono = { path = "vendor/chrono" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
futures = { version = "0.3", default-features = false, features = ["executor"] }
